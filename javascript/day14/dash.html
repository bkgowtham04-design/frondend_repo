<body>

  <h1>Welcome to Dashboard Gowtham</h1>

  <button onclick="logout()">Logout</button>

  <script>
  




    if(localStorage.getItem("isLoggedIn") !== "true") {



      window.location.href = "form.html"
    }

    function logout() {
      localStorage.removeItem("isLoggedIn")
      window.location.href = "form.html"
    }
  </script>
