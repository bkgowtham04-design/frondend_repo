<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <body class="bg-gray-100 flex justify-center items-center h-screen">

  <div class="bg-white p-8 rounded-2xl shadow-lg w-96">
    
    <h2 class="text-2xl font-bold text-center mb-6">LOGIN</h2>

    <form id="form" class=  "flex flex-col gap-4  ">

      <input id="useremail" type="email" placeholder="Enter Your Email" class="border p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">

      <input id="userpassword" type="password" placeholder="Enter Your Password" class="border p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">

      <button id="btn" class="bg-blue-500 text-white p-3 rounded-lg hover:bg-blue-600 transition duration-300">
        Submit
      </button>

    </form>

  </div>

<script>

const button = document.getElementById("btn")

     button.addEventListener("click", (e) => {

  e.preventDefault()

  const useremail = document.getElementById("useremail").value




      const userpassword = document.getElementById("userpassword").value


      const formhand = document.getElementById("form")

   
      let user = JSON.parse(localStorage.getItem("login")) ||    []

  const datas = { useremail, userpassword }




  user.push(datas)


  console.log(user);
  



       localStorage.getItem("login",JSON.stringify(user))


       


    // const change = JSON.stringify(user)

    // localStorage.setItem(change)

       alert("Successfully Added")

       formhand.reset()

})

</script>




</body>
</html>
